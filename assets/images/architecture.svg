<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowlt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <line x1="145" y1="110" x2="145" y2="158" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="230" y1="187" x2="318" y2="187" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="178" x2="588" y2="154" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="200" x2="588" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145" y1="216" x2="145" y2="278" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="205" y1="216" x2="378" y2="338" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowlt)"/>
  <line x1="455" y1="448" x2="455" y2="398" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowlt)"/>
  <line x1="550" y1="475" x2="618" y2="475" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowlt)"/>

  <text x="156" y="138" font-size="11" fill="#6b7280">Discord DM</text>
  <text x="274" y="180" font-size="11" fill="#6b7280" text-anchor="middle">MCP / HTTP</text>
  <text x="156" y="252" font-size="11" fill="#6b7280">LLM call</text>
  <text x="300" y="268" font-size="10.5" fill="#9ca3af">optional route</text>
  <text x="470" y="426" font-size="10.5" fill="#9ca3af">scrapes</text>

  <rect x="330" y="290" width="540" height="298" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="352" y="314" font-size="13" fill="#6b7280">Optional add-ons</text>

  <rect x="60" y="58" width="170" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="145" y="82" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">You</text>
  <text x="145" y="100" font-size="12" fill="#6b7280" text-anchor="middle">Discord</text>

  <rect x="60" y="158" width="170" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="184" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">bot</text>
  <text x="145" y="202" font-size="11.5" fill="#475569" text-anchor="middle">Discord + LLM agent</text>

  <rect x="318" y="158" width="187" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="411" y="184" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">mcp-tools</text>
  <text x="411" y="202" font-size="11.5" fill="#475569" text-anchor="middle">Notion + Calendar tools</text>

  <rect x="60" y="278" width="185" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="152" y="302" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">LLM</text>
  <text x="152" y="320" font-size="11.5" fill="#475569" text-anchor="middle">Ollama or Anthropic</text>

  <rect x="588" y="132" width="120" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="648" y="158" font-size="13" fill="#334155" text-anchor="middle">Notion</text>

  <rect x="588" y="192" width="165" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="670" y="218" font-size="13" fill="#334155" text-anchor="middle">Google Calendar</text>

  <rect x="360" y="340" width="190" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="455" y="366" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">agentgateway</text>
  <text x="455" y="384" font-size="11" fill="#6b7280" text-anchor="middle">LLM proxy + cost tracking</text>

  <rect x="360" y="448" width="190" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="455" y="473" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">alloy</text>
  <text x="455" y="491" font-size="11" fill="#6b7280" text-anchor="middle">metrics shipper</text>

  <rect x="618" y="452" width="170" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="703" y="481" font-size="13" fill="#334155" text-anchor="middle">Grafana Cloud</text>

  <text x="40" y="606" font-size="11" fill="#9ca3af">Solid = core path &#183; Dashed = optional add-ons</text>
